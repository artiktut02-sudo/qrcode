<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Мои Документы QR</title>
  <link rel="stylesheet" href="css/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
</head>
<body>

  <header class="topbar">
    <h1>📁 Мои Файлы</h1>
    <p>Загрузите файл и получите QR-код</p>
  </header>

  <main>
    <div class="upload-zone" id="upload-zone">
      <input type="file" id="file-input" hidden />
      <div class="upload-icon">📤</div>
      <div class="upload-text">Нажмите, чтобы выбрать файл</div>
    </div>

    <h2 class="section-title">Ваши файлы</h2>
    <div id="documents-list" class="documents-grid"></div>
  </main>

  <div id="qr-modal" class="modal hidden">
    <div class="modal-content">
      <button class="close-btn" onclick="closeModal()">✕</button>
      <h2 id="modal-title">QR-код файла</h2>
      <div class="qr-container" id="qrcode"></div>
      <p class="qr-hint">Наведите камеру телефона, чтобы открыть файл</p>
      <button class="btn-primary" onclick="downloadQR()">Скачать QR-код</button>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
